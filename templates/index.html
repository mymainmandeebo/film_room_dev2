  <section id="projectsHubView" class="flex-1 p-4 sm:p-6 max-w-[1600px] mx-auto w-full grid grid-cols-1 lg:grid-cols-12 gap-6">
    <!-- LEFT COLUMN: PRIMARY WORKSPACE (GAME FILMS) -->
    <div class="lg:col-span-8 flex flex-col gap-4">
      <div class="flex justify-between items-center pb-2.5 border-b border-md-outline-variant dark:border-md-dark-outline-variant">
        <div>
          <h2 class="text-xl font-medium tracking-tight text-md-on-surface dark:text-md-dark-on-surface flex items-center gap-2">
            <span class="material-symbols-outlined text-md-primary dark:text-md-dark-primary" style="font-size: 24px;">videocam</span>
            Game Films
          </h2>
          <p class="text-xs text-md-on-surface-variant dark:text-md-dark-on-surface-variant mt-0.5">Analyze full game tapes and slice active plays.</p>
        </div>
        <button id="btnOpenNewProjectModal" class="hidden md-btn-filled bg-md-primary dark:bg-md-dark-primary text-md-on-primary dark:text-md-dark-on-primary !py-2 !px-4 !text-sm">
          <span class="material-symbols-outlined" style="font-size: 18px;">add</span>
          New Game
        </button>
      </div>

      <!-- Search & Filter Controls -->
      <div class="flex flex-wrap gap-2.5 bg-md-surface-container-high dark:bg-md-dark-surface-container-high p-3 rounded-md-lg border border-md-outline-variant dark:border-md-dark-outline-variant shadow-inner">
        <div class="relative flex-1 min-w-[200px]">
          <span class="material-symbols-outlined absolute left-2.5 top-2 text-md-on-surface-variant dark:text-md-dark-on-surface-variant" style="font-size: 18px;">search</span>
          <input type="text" id="dashboardSearchInput" oninput="filterDashboardGames()" placeholder="Search opponent, title, or notes..." class="w-full bg-md-surface-container-lowest dark:bg-md-dark-surface-container-lowest border border-md-outline-variant dark:border-md-dark-outline-variant rounded-md-sm pl-8 pr-3 py-1.5 text-xs text-md-on-surface dark:text-md-dark-on-surface focus:outline-none focus:border-md-primary">
        </div>
        <select id="dashboardSportFilter" onchange="filterDashboardGames()" class="bg-md-surface-container-lowest dark:bg-md-dark-surface-container-lowest border border-md-outline-variant dark:border-md-dark-outline-variant rounded-md-sm px-2.5 py-1 text-xs text-md-on-surface dark:text-md-dark-on-surface focus:outline-none">
          <option value="ALL">All Sports</option>
          <option value="Basketball">🏀 Basketball</option>
          <option value="Football">🏈 Football</option>
          <option value="Soccer">⚽ Soccer</option>
        </select>
        <select id="dashboardSortFilter" onchange="filterDashboardGames()" class="bg-md-surface-container-lowest dark:bg-md-dark-surface-container-lowest border border-md-outline-variant dark:border-md-dark-outline-variant rounded-md-sm px-2.5 py-1 text-xs text-md-on-surface dark:text-md-dark-on-surface focus:outline-none">
          <option value="recent">Sort: Recent</option>
          <option value="oldest">Sort: Oldest</option>
        </select>
      </div>

      <!-- Games List -->
      <div id="projectsGrid" class="flex flex-col gap-4"></div>
    </div>

    <!-- RIGHT COLUMN: PLAYLIST REELS & ROSTERS -->
    <div class="lg:col-span-4 flex flex-col gap-6">
      <!-- Playlist Reels Card Group -->
      <div class="flex flex-col gap-3">
        <div class="flex justify-between items-center pb-2 border-b border-md-outline-variant dark:border-md-dark-outline-variant">
          <h3 class="text-sm font-semibold tracking-wider uppercase text-md-on-surface dark:text-md-dark-on-surface flex items-center gap-1.5">
            <span class="material-symbols-outlined text-md-tertiary dark:text-md-dark-tertiary" style="font-size: 18px;">video_library</span>
            Playlist Reels
          </h3>
          <button onclick="openReelModal(null)" class="md-btn-text text-md-tertiary dark:text-md-dark-tertiary !py-1 !px-2 !text-xs !rounded-full">
            <span class="material-symbols-outlined" style="font-size: 16px;">add</span> New Reel
          </button>
        </div>
        <div id="homeReelsList" class="flex flex-col gap-3"></div>
      </div>

      <!-- Rosters Card Group -->
      <div class="flex flex-col gap-3">
        <div class="flex justify-between items-center pb-2 border-b border-md-outline-variant dark:border-md-dark-outline-variant">
          <h3 class="text-sm font-semibold tracking-wider uppercase text-md-on-surface dark:text-md-dark-on-surface flex items-center gap-1.5">
            <span class="material-symbols-outlined text-md-primary dark:text-md-dark-primary" style="font-size: 18px;">groups</span>
            Team Rosters
          </h3>
          <button id="btnCreateRosterModal" class="md-btn-text text-md-primary dark:text-md-dark-primary !py-1 !px-2 !text-xs !rounded-full">
            <span class="material-symbols-outlined" style="font-size: 16px;">add</span> New Roster
          </button>
        </div>
        <div id="homeRostersList" class="flex flex-col gap-3"></div>
      </div>
    </div>
  </section>
